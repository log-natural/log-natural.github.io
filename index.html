<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="개발자 포트폴리오">
  <title>Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-shell">
    <aside class="profile">
      <div class="profile-inner">
        <img id="profile-image" class="profile-image" src="assets/profile.svg" alt="프로필 이미지">
        <p class="eyebrow">DEVELOPER PORTFOLIO</p>
        <h1 id="profile-name">자연로그</h1>
        <p id="profile-role" class="profile-role">Developer · Information Science</p>
        <p id="profile-bio" class="profile-bio">프로젝트를 만들고, 문제를 구조화하고, 직접 구현하는 것을 좋아합니다.</p>

        <div id="social-links" class="social-links" aria-label="SNS 링크"></div>

        <div class="profile-divider"></div>
        <div>
          <p class="section-label">INTERESTS</p>
          <p id="profile-interests" class="small-copy">Web · AI · Algorithms</p>
        </div>
        <div>
          <p class="section-label">STACK</p>
          <div id="profile-stack" class="stack-list"></div>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="content-header">
        <div>
          <p class="eyebrow">SELECTED WORKS</p>
          <h2>Projects</h2>
        </div>
        <div class="header-meta">
          <span id="project-count">0 projects</span>
        </div>
      </header>

      <section id="project-grid" class="project-grid" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>아직 등록된 프로젝트가 없습니다.</p>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
