<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Portfolio</title>

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --sub:#94a3b8;
    --accent:#38bdf8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
}

nav{
    position:fixed;
    top:0;
    width:100%;
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(15,23,42,0.9);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.logo{
    font-size:1.3rem;
    font-weight:700;
}

nav ul{
    display:flex;
    gap:30px;
    list-style:none;
}

nav a{
    color:white;
    text-decoration:none;
    transition:.3s;
}

nav a:hover{
    color:var(--accent);
}

section{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:120px 10%;
}

.container{
    max-width:1100px;
    width:100%;
}

.hero{
    text-align:center;
}

.hero h1{
    font-size:4rem;
    margin-bottom:20px;
}

.hero p{
    color:var(--sub);
    font-size:1.2rem;
    margin-bottom:40px;
}

.btn{
    display:inline-block;
    padding:14px 30px;
    background:var(--accent);
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
}

.about{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.profile{
    width:300px;
    height:300px;
    border-radius:20px;
    overflow:hidden;
    background:var(--card);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.about-text h2{
    font-size:3rem;
    margin-bottom:20px;
}

.about-text p{
    line-height:1.8;
    color:var(--sub);
}

.social-links{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:24px;
}

.social-links a{
    text-decoration:none;
    color:white;
    background:var(--card);
    padding:12px 18px;
    border-radius:12px;
    transition:.25s;
}

.social-links a:hover{
    background:var(--accent);
    transform:translateY(-2px);
}

.project-section h2{
    font-size:3rem;
    margin-bottom:40px;
    text-align:center;
}

.section-title{
    font-size:3rem;
    margin-bottom:40px;
    text-align:center;
}

.project-layout{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:40px;
}

.project-list{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.project-btn{
    padding:24px;
    background:#1e293b;
    border:none;
    color:white;
    font-size:1rem;
    text-align:left;
    border-radius:14px;
    cursor:pointer;
    transition:.3s;
}

.project-btn:hover{
    background:#334155;
}

.project-btn.active{
    background:#38bdf8;
}

.project-view{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.project-view img{
    width:100%;
    height:450px;
    object-fit:cover;
    border-radius:20px;
}

.project-info{
    background:#1e293b;
    padding:25px;
    border-radius:20px;
}

.project-info h3{
    margin-bottom:10px;
}

.project-info p{
    color:#94a3b8;
    line-height:1.7;
    margin-bottom:15px;
}

.project-info a,
.social-links a{
    color:white;
    text-decoration:none;
    transition:.2s;
}

.project-info a:hover,
.social-links a:hover{
    color:var(--accent);
}

a{
    color: inherit;
    text-decoration: none;
}

@media(max-width:900px){

    .project-layout{
        grid-template-columns:1fr;
    }

    .project-list{
        flex-direction:row;
        overflow:auto;
    }

    .project-btn{
        min-width:180px;
    }
}

.number{
    color:var(--accent);
    font-size:1rem;
    margin-bottom:10px;
}

footer{
    text-align:center;
    padding:40px;
    color:var(--sub);
}

@media(max-width:768px){

    nav{
        padding:20px;
    }

    nav ul{
        display:none;
    }

    .hero h1{
        font-size:2.5rem;
    }

    .about{
        grid-template-columns:1fr;
        text-align:center;
    }

    .profile{
        margin:auto;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">PORTFOLIO</div>

    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#project1">Works</a></li>
    </ul>
</nav>

<!-- 시작 화면 -->
<section id="home">
    <div class="container hero">
        <h1>Log_natural | 자연로그</h1>
        <p>logarithmus naturalis</p>

        <a href="#about" class="btn">
            포트폴리오 보기
        </a>
    </div>
</section>

<!-- 자기소개 -->
<section id="about">
    <div class="container about">

        <div class="profile">
          <img src="https://avatars.githubusercontent.com/u/176019198?v=4" alt="프로필 사진">
        </div>
 
        <div class="about-text">
            <h2>About Me</h2>
            <p>
                수과학에 관심이 많고 바이브코딩 웹 개발을 주로 하는 개발자입니다.
            </p>
             <div class="social-links">
    <a href="https://github.com/log-natural" target="_blank">
        GitHub
    </a>

    <a href="mailto:csj646578@gmail.com">
        Email
    </a>

</div>

        </div>

    </div>

</section>

<section id="projects">
    <div class="container">

        <h2 class="section-title">Projects</h2>

        <div class="project-layout">

            <!-- 왼쪽 목록 -->
            <div class="project-list">

                <button class="project-btn active"
                    onclick="showProject(0)">
                    [p5.js] 삼각함수 그래프 애니메이션
                </button>

                <button class="project-btn"
                    onclick="showProject(1)">
                    [p5.js] 몬테카를로 파이 시뮬레이터
                </button>

                <button class="project-btn"
                    onclick="showProject(2)">
                    DP 배낭문제 시각화
                </button>

                <button class="project-btn"
                    onclick="showProject(3)">
                    이모지 뽑기
                </button>

            </div>

            <!-- 오른쪽 -->
            <div class="project-view">

                <img id="preview"
                    src="https://picsum.photos/900/500"
                    alt="프로젝트 미리보기">

                <div class="project-info">

                    <h3 id="title">
                        포트폴리오 사이트
                    </h3>

                    <p id="desc">
                        HTML, CSS, JavaScript를 활용하여
                        제작한 개인 포트폴리오 사이트입니다.
                    </p>

                    <a id="link"
                        href="#"
                        target="_blank">
                        프로젝트 보기 →
                    </a>

                </div>

            </div>

        </div>

    </div>
</section>

<footer>
    @log_natural Portfolio
</footer>

<script>

const projects = [

{
    title:"[p5.js] 삼각함수 그래프 애니메이션",
    image:"https://picsum.photos/id/10/900/500",
    desc:"좌표평면에 6개의 삼각함수 그래프를 나타낸 애니메이션입니다.",
    link:"https://editor.p5js.org/log_natural/sketches/Uro16Dkd6"
},

{
    title:"[p5.js] 몬테카를로 파이 시뮬레이터",
    image:"https://picsum.photos/id/20/900/500",
    desc:"몬테카를로 방법을 이용해 파이값을 구하는 프로그램입니다.",
    link:"https://editor.p5js.org/log_natural/sketches/NE18wBu1h"
},

{
    title:"DP 배낭 문제 시각화",
    image:"https://picsum.photos/id/20/900/500",
    desc:"제한된 무게 내에 최대 가치를 지닌 물건을 고르는 배낭 문제의 해결 과정을 보여줍니다.",
    link:"http://knapsack.kro.kr/"
},

{
    title:"이모지 뽑기",
    image:"https://picsum.photos/id/40/900/500",
    desc:"지정한 개수와 카테고리에 맞게 이모지를 랜덤으로 뽑는 프로그램입니다.",
    link:"https://github.com/log-natural/emojipick"
}

];
function showProject(index){

    document.getElementById("preview").src =
        projects[index].image;

    document.getElementById("title").textContent =
        projects[index].title;

    document.getElementById("desc").textContent =
        projects[index].desc;

    document.getElementById("link").href =
        projects[index].link;

    document.querySelectorAll(".project-btn")
        .forEach(btn => btn.classList.remove("active"));

    document.querySelectorAll(".project-btn")[index]
        .classList.add("active");
}


</script>

</body>
</html>
